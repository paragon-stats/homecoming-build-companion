# homecoming-build-companion - Python configuration
# Python 3.14+ required

[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homecoming-build-companion"
dynamic = ["version"]
description = "Claude project for designing City of Heroes (Homecoming) character builds against MidsReborn data"
requires-python = ">=3.14"
dependencies = [
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=4.5.1",
    "ruff>=0.8.0,<1.0.0",
    "mypy>=1.0.0,<2.0.0",
    "types-PyYAML>=6.0.12",
    # The release action pins 10.6.2; the same major here keeps `semantic-release version
    # --print` usable locally for previewing the next version.
    "python-semantic-release>=10.6.0,<11.0.0",
]

[tool.setuptools.package-dir]
coh_engine = "src/coh_engine"

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["scripts*", "coh_engine*"]
exclude = ["scripts.*.tests*", "scripts.*.fixtures*", "coh_engine.tests*"]

[tool.setuptools-scm]

# Releases: semver derived from Conventional Commits, cut by python-semantic-release
# through paragon-stats/github-actions/release (.github/workflows/release.yml), tag-only.
#
# There is no version literal to write. `project.dynamic = ["version"]` plus
# setuptools-scm above means the package version comes from the git tag, so the tool
# only has to create the tag. No `version_variables` / `version_toml`: pointing the tool
# at a file would create a second source of truth that setuptools-scm would then ignore.
# Nothing is committed back either: a version-bump commit would be a no-op that also
# has to satisfy the signed-commit ruleset.
[tool.semantic_release]
tag_format = "v{version}"
# Below 1.0.0 a breaking change bumps the minor, not the major. The `!` marker is still
# written on breaking commits; it just does not force 1.0.0 while the checkpoint ladder
# is unfinished. Flip to true when cutting 1.0.0.
major_on_zero = false
allow_zero_version = true

[tool.semantic_release.branches.main]
# The release runs on `main` only; the bump comes from the commits that merge into it.
match = "main"
prerelease = false

[tool.semantic_release.commit_parser_options]
# The release level per commit type. The list restates paragon-stats/github-actions
# commit-types.txt, which stays the source of truth: the commitlint workflow diffs the
# two and fails on drift. A type in `allowed_tags` that is in neither `minor_tags` nor
# `patch_tags` cuts nothing, so a docs-only or chore-only merge produces no release.
allowed_tags = [
    "feat", "fix", "perf", "security", "revert",
    "docs", "test", "ci", "chore", "style", "refactor", "build",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "security", "revert"]
# The parser's default, pinned: the bump is read from the branch commits a merge brings
# in, never from the merge commit, whose subject is the PR title.
ignore_merge_commits = true

[tool.coverage.run]
relative_files = true
branch = true
source = ["scripts", "src"]
omit = [
    "*/test_*.py",
    "*/tests/*",
    "*/conftest.py",
    "**/__main__.py",
]

[tool.coverage.paths]
source = [
    "scripts",
    "*/homecoming-build-companion/scripts",
]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
fail_under = 100

[tool.ruff]
line-length = 120
target-version = "py314"
# Markdown is markdownlint's: ruff would reformat illustrative Python inside docs and rule files.
# force-exclude keeps the exclusion when pre-commit passes file paths explicitly.
extend-exclude = ["*.md"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "C90",    # mccabe cyclomatic complexity (max-complexity below)
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "N",      # pep8-naming
    "D",      # pydocstyle
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM108", # Use ternary operator (readability preference)
    "D100",   # undocumented-public-module (phased rollout)
    "D101",   # undocumented-public-class (phased rollout)
    "D102",   # undocumented-public-method (phased rollout)
    "D103",   # undocumented-public-function (phased rollout)
    "D107",   # undocumented-public-init (phased rollout)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/test_*.py" = ["D"]
"**/conftest.py" = ["D"]

[tool.ruff.lint.mccabe]
# McCabe's canonical threshold (also ruff/flake8 convention). Cyclomatic, not
# SonarQube's cognitive metric — ruff has no cognitive rule.
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["scripts", "coh_engine"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# The build-calculation engine is held to mypy strict (issue #4 enables strict
# repo-wide; the engine is strict from the start since it is written fully typed).
# `strict` is a superflag not settable per-module, so its component checks are
# enumerated here for the coh_engine package (and its tests).
[[tool.mypy.overrides]]
module = "coh_engine.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

# Test modules stay strict on defs/types, but the pre-commit mypy hook runs in an
# isolated env without pytest, so its decorators (@fixture, @parametrize) read as
# untyped there. Relax only that check for tests to keep the hook green.
[[tool.mypy.overrides]]
module = "coh_engine.tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
pythonpath = [".", "src"]
# Without testpaths, bare pytest walks the whole repo — including the huge
# harvested game-data trees (data/canonical/) and prose dirs.
testpaths = ["scripts", "src"]

[tool.pylint.main]
# Pylint disabled - ruff is the standard linter for this repository
ignore-patterns = [".*"]
