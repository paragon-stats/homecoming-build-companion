---
# GitLab CI for homecoming-build-companion. `origin` is GitLab
# (paragon-stats/homecoming-build-companion), so the gating checks belong here.
#
# Source of truth for the shared jobs is the CI/CD Catalog at
# pete.kloehn/ci-templates; kloehnwars-homelab's .gitlab-ci.yml is the working
# consumer this file follows. Under the catalog's "Option 1" split the consumer
# owns `default:`, `workflow:`, `stages:` and `variables:`; the components ship
# only jobs.
#
# The GitHub workflows (.github/workflows/*) stay in place and authoritative on
# that platform, so the repo still ports back to GitHub unchanged. Two of them
# have no counterpart here yet:
#   - super-linter.yml  — needs a MegaLinter config (.mega-linter.yml), the
#     substitute the sibling repos use on GitLab. The pre-commit job already
#     runs markdownlint and editorconfig-checker against the same configs
#     Super-Linter uses, so the gap is the remaining linters, not all of them.
#   - calver-tag.yml    — release tagging, default-branch only.

default:
  tags:
    - ci
  interruptible: true

# Merge-request pipelines (so the MR widgets populate) and the default branch.
# No pipeline on a plain feature-branch push.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

variables:
  # Sanctioned env escape for the always-run local-developer guard: the runner
  # authors no commits, so it has no signing identity to check. The hook honors
  # this var by design and .github/workflows/pre-commit.yml sets the same one,
  # so this is not the SKIP= hook bypass .claude/rules/devsecops.md prohibits.
  SKIP_GIT_SIGNING_CHECK: "1"

stages:
  - lint
  - test

include:
  - component: $CI_SERVER_FQDN/pete.kloehn/ci-templates/pre-commit@0.1.0
    inputs:
      stage: lint
      # super-linter is a manual-stage hook, so a plain run never reaches it;
      # named anyway to match the SKIP default in .github/workflows/pre-commit.yml
      # and to keep the intent explicit if the stage ever changes.
      skip: "super-linter"
  - component: $CI_SERVER_FQDN/pete.kloehn/ci-templates/commit-lint@0.1.0
    inputs:
      stage: lint
      ref: "0.1.0"

# The component caches pre-commit's hook environments but not pip's wheels, and
# this repo's `[dev]` extra is a large install. Overriding `cache` replaces the
# component's entry outright rather than merging, so its pre-commit entry is
# restated here alongside the pip one.
pre-commit:
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    - key:
        files:
          - .pre-commit-config.yaml
      paths:
        - .cache/pre-commit
    - key:
        files:
          - pyproject.toml
      paths:
        - .cache/pip

# pytest with the 100%-coverage gate, one job per package — parity with the
# matrix in .github/workflows/pytest-coverage.yml. One job per package so a
# failure names the package that failed instead of hiding behind the first one;
# re-sync the matrix when a package is added.
pytest:
  stage: test
  image: python:3.14-slim
  coverage: '/TOTAL.*\s(\d+)%/'
  parallel:
    matrix:
      - PACKAGE: ci
        TEST_PATH: scripts/ci/tests
        COV_PATH: scripts/ci
      - PACKAGE: common
        TEST_PATH: scripts/common/tests
        COV_PATH: scripts/common
      - PACKAGE: dev
        TEST_PATH: scripts/dev/tests
        COV_PATH: scripts/dev
      - PACKAGE: devops
        TEST_PATH: scripts/devops/tests
        COV_PATH: scripts/devops
      - PACKAGE: github
        TEST_PATH: scripts/github/tests
        COV_PATH: scripts/github
      - PACKAGE: testing-hooks
        TEST_PATH: scripts/testing/hooks/tests
        COV_PATH: scripts/testing/hooks
      - PACKAGE: coh-engine
        TEST_PATH: src/coh_engine/tests
        COV_PATH: src/coh_engine
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PYTHONWARNINGS: default
  cache:
    - key:
        files:
          - pyproject.toml
      paths:
        - .cache/pip
  before_script:
    # slim ships no git; some test fixtures and the packaging metadata want it.
    - apt-get update && apt-get install -y --no-install-recommends git
    - python -m pip install --upgrade pip
    - python -m pip install '.[dev]'
  script:
    - mkdir -p reports
    - >
      python -m pytest -vv "$TEST_PATH"
      --log-cli-level=INFO
      --cov="$COV_PATH"
      --cov-report=term-missing
      --cov-report=xml:"reports/coverage-$PACKAGE.xml"
      --cov-fail-under=100
      --junitxml="reports/pytest-$PACKAGE.xml"
  artifacts:
    when: always
    reports:
      junit: reports/pytest-$PACKAGE.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage-$PACKAGE.xml
    paths:
      - reports/
    expire_in: 2 weeks
...
