name: coh-engine CodeQL config

# obj/ holds generated, intermediate build files — xUnit/MSBuild emit C# there (the
# test entry point, AssemblyInfo, GlobalUsings) that we don't author or edit.
# GitHub documents paths-ignore for interpreted languages and for compiled languages
# analyzed without a build. The C# job builds (build-mode: manual), so the filter is
# ignored there: codeql.yml strips obj/ results from the C# SARIF before uploading it
# (scripts/ci/filter_sarif.py). This filter still applies to the Python job.
paths-ignore:
  - "**/obj/**"
