---
# Label taxonomy for homecoming-build-companion (paragon-stats/homecoming-build-companion
# on GitHub — the repository's only home).
# Reconcile the label set from this file with (idempotent, safe to re-run):
#   gh label create <name> --color <color> --description <desc> --force --repo <repo>
#
# The "key::value" names group the taxonomy by prefix. GitHub has no scoped-label concept,
# so this is a naming convention rather than a rendered behaviour; the shape is kept
# because it sorts the labels usefully and matches the sibling repos.
#
# Colors follow the maintainer's convention across repos: type azure, area purple,
# priority traffic-light. See paragon-stats/.github/labels.yml for the sibling taxonomy.
#
# Deliberately absent:
#   status/*  - issue state and Projects boards already track it.
#   risk/*    - "Risk / Severity" is a required field in the work-package issue template.
#
# These labels are per-repository. GitHub has no org-wide label set to inherit from, so a
# sibling repo adopting this taxonomy copies this file and runs the same reconcile command.

# Types — Azure (#1d76db)
- name: "type::feat"
  color: "1d76db"
  description: "New feature"
- name: "type::fix"
  color: "1d76db"
  description: "Bug fix"
- name: "type::bug"
  color: "1d76db"
  description: "Bug report / defect"
- name: "type::enh"
  color: "1d76db"
  description: "Enhancement / improvement"
- name: "type::perf"
  color: "1d76db"
  description: "Performance improvement"
- name: "type::security"
  color: "1d76db"
  description: "Security-specific change"
- name: "type::refactor"
  color: "1d76db"
  description: "Restructure without behavior change"
- name: "type::test"
  color: "1d76db"
  description: "Tests-only change"
- name: "type::chore"
  color: "1d76db"
  description: "Tooling, config, hygiene"
- name: "type::docs"
  color: "1d76db"
  description: "Documentation change"

