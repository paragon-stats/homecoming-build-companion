name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1"  # weekly baseline scan

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false  # required check: a cancelled run must still report

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            os: windows-latest
            build-mode: manual
          - language: python
            os: ubuntu-latest
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0  # MinVer derives the version from git history + tags
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        if: matrix.language == 'csharp'
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml
      # C# is compiled, so CodeQL needs a real build (more reliable than autobuild
      # with Central Package Management + analyzers). Python needs no build step.
      - name: Build
        if: matrix.language == 'csharp'
        run: dotnet build --no-incremental
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        if: matrix.language == 'python'
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-sarif
      # The upload above is done; this only prints what the Python results contain.
      - name: List remaining results
        if: matrix.language == 'python'
        shell: bash
        env:
          SARIF_DIR: ${{ runner.temp }}/codeql-sarif
        run: python3 -m scripts.ci.filter_sarif --list-only "$SARIF_DIR"
      # paths-ignore is ignored for a language analysed with a build, so the C# results are
      # written to disk, stripped of generated obj/ findings, then uploaded under the same
      # category and tool name.
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        if: matrix.language == 'csharp'
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: ${{ runner.temp }}/codeql-sarif
      - name: Drop generated-file results
        if: matrix.language == 'csharp'
        shell: bash
        env:
          SARIF_DIR: ${{ runner.temp }}/codeql-sarif
        run: python -m scripts.ci.filter_sarif "$SARIF_DIR"
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        if: matrix.language == 'csharp'
        with:
          sarif_file: ${{ runner.temp }}/codeql-sarif
          category: /language:${{ matrix.language }}
