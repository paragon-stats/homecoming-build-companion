name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
    types: [checks_requested]
  schedule:
    - cron: "27 3 * * 1"  # weekly baseline scan

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false  # required check: a cancelled run must still report

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            os: windows-latest
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0  # MinVer derives the version from git history + tags
      # The C# build needs it, and so does the SARIF filter script.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml
      # C# is compiled, so CodeQL needs a real build (more reliable than autobuild
      # with Central Package Management + analyzers).
      - name: Build
        if: matrix.language == 'csharp'
        run: dotnet build --no-incremental
      # paths-ignore is ignored for a language analysed with a build, so the C# results are
      # written to disk, stripped of generated obj/ findings, then uploaded under the same
      # category and tool name.
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        if: matrix.language == 'csharp'
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: ${{ runner.temp }}/codeql-sarif
      - name: Drop generated-file results
        if: matrix.language == 'csharp'
        shell: bash
        env:
          SARIF_DIR: ${{ runner.temp }}/codeql-sarif
        run: dotnet run scripts/ci/filter-sarif.cs -- "$SARIF_DIR"
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        if: matrix.language == 'csharp'
        with:
          sarif_file: ${{ runner.temp }}/codeql-sarif
          category: /language:${{ matrix.language }}
