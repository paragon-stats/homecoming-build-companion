---

name: Commit Message Lint
on:
  pull_request:
    types: [opened, synchronize, edited, reopened]
permissions:
  contents: read


jobs:
  commitlint:
    name: Lint the commits on the pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # pull-requests:read is required so report-status-context can fetch the PR merge/head SHA.
      contents: read
      pull-requests: read
      # statuses:write is required so the report-status-context composite action
      # can publish the commit status for this job on the pull request.
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'

      - name: Lint commit messages
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          failed=0
          for sha in $(git log --format=%H "origin/$BASE_REF"..HEAD); do
            tmpfile=$(mktemp)
            git log -1 --format=%B "$sha" > "$tmpfile"
            if ! python3 scripts/testing/hooks/check_commit_message.py "$tmpfile"; then
              echo "::error::Commit $sha failed commitlint"
              failed=1
            fi
            rm -f "$tmpfile"
          done
          exit $failed

      - name: Report required status context
        if: ${{ github.event_name == 'pull_request' && always() }}
        uses: $/.github/actions/report-status-context
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
          job-status: ${{ job.status }}
          status-context: Commit Message Lint / commitlint
          target-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # pyproject.toml restates the bump mapping for the release tooling; the org's
  # commit-types.txt (paragon-stats/github-actions, pinned to the same SHA as the
  # release action) stays the source of truth. Drift fails this job, which reports
  # the required context `Commit Message Lint / release-policy`; the ruleset makes
  # that context block the merge, so a drifted policy cannot reach main.
  release-policy:
    name: Verify the release bump mapping matches the org fact-set
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'

      - name: Compare pyproject.toml with commit-types.txt
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/paragon-stats/github-actions/8e164c6001e7a28bf2b06e6c528f97cda9af37cb"
          curl -fsSL --proto '=https' "$base/commit-types.txt" -o "$RUNNER_TEMP/commit-types.txt"
          # As a module, not a file: the checker imports the commit-lint allowlist from
          # its package, which needs the repository root on sys.path.
          python3 -m scripts.testing.hooks.check_release_policy "$RUNNER_TEMP/commit-types.txt" pyproject.toml

      - name: Report required status context
        if: ${{ always() }}
        uses: $/.github/actions/report-status-context
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
          job-status: ${{ job.status }}
          status-context: Commit Message Lint / release-policy
          target-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # The PR title is load-bearing: with merge_commit_title = PR_TITLE it becomes the
  # subject of the merge commit on main, which the changelog and the version bump both
  # read. Nothing validated it until this job existed, so a badly-typed title could put
  # a non-conventional commit on main with no gate anywhere in the pipeline.
  pr-title:
    name: Lint the pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'

      - name: Lint the PR title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          tmpfile=$(mktemp)
          echo "$PR_TITLE" > "$tmpfile"
          if ! python3 scripts/testing/hooks/check_commit_message.py "$tmpfile"; then
            echo "::error::PR title is not a valid conventional commit. It becomes the merge commit subject on main."
            rm -f "$tmpfile"
            exit 1
          fi
          rm -f "$tmpfile"

      - name: Report required status context
        if: ${{ always() }}
        uses: $/.github/actions/report-status-context
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
          job-status: ${{ job.status }}
          status-context: Commit Message Lint / pr-title
          target-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
