---

name: Commit Message Lint
on:
  pull_request:
    types: [opened, synchronize, edited, reopened]
  merge_group:
    branches: [main]
    types: [checks_requested]
permissions:
  contents: read


jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # statuses:write is required so the report-status-context composite action
      # can publish the commit status for this job on the pull request.
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The validator is paragon-stats/github-actions' check-commit-message.sh, vendored
      # in scripts/git so the Husky commit-msg hook runs the same file; release-policy
      # holds the copy byte-identical to the tagged upstream.
      - name: Lint commit messages
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/commit-msg.txt"
            if ! MESSAGE_FILE="$RUNNER_TEMP/commit-msg.txt" \
                 CHANGED_PATHS="$(git diff-tree --no-commit-id --name-only -r "$sha")" \
                 bash scripts/git/check-commit-message.sh; then
              echo "::error::Bad commit (bad format, or a release-triggering type without a src/ change): $(git log -1 --format='%h %s' "$sha")"
              fail=1
            fi
          done
          exit "$fail"

      - name: Report required status context
        if: ${{ github.event_name == 'pull_request' && always() }}
        uses: $/.github/actions/report-status-context
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          job-status: ${{ job.status }}
          status-context: Commit Message Lint / commitlint
          target-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # scripts/git holds the org's validator and commit-types.txt, vendored from
  # paragon-stats/github-actions at the SHA the release action is pinned to, and
  # commit-types.txt stays the source of truth. pyproject.toml restates the bump
  # mapping for the release tooling. An edited copy or a drifted mapping fails this
  # job, which reports the required context `Commit Message Lint / release-policy`;
  # it runs in the merge queue too, so neither can reach main.
  release-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the vendored validator matches upstream v2.2.1
        shell: bash
        run: |
          base="https://raw.githubusercontent.com/paragon-stats/github-actions/8e164c6001e7a28bf2b06e6c528f97cda9af37cb"
          curl -fsSL --proto '=https' "$base/check-commit-message/check-commit-message.sh" -o "$RUNNER_TEMP/upstream.sh"
          curl -fsSL --proto '=https' "$base/commit-types.txt" -o "$RUNNER_TEMP/upstream-types.txt"
          drift=0
          diff -u "$RUNNER_TEMP/upstream.sh" scripts/git/check-commit-message.sh || drift=1
          diff -u "$RUNNER_TEMP/upstream-types.txt" scripts/git/commit-types.txt || drift=1
          if [ "$drift" -ne 0 ]; then
            echo "::error::scripts/git/ has drifted from paragon-stats/github-actions@8e164c6 (v2.2.1). Never edit the vendored copy; re-vendor from the new upstream pin and bump this SHA."
            exit 1
          fi

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          global-json-file: global.json

      - name: Compare pyproject.toml with commit-types.txt
        run: dotnet run scripts/ci/check-release-policy.cs -- scripts/git/commit-types.txt pyproject.toml

      - name: Report required status context
        if: ${{ always() }}
        uses: $/.github/actions/report-status-context
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          job-status: ${{ job.status }}
          status-context: Commit Message Lint / release-policy
          target-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # The PR title is load-bearing: with merge_commit_title = PR_TITLE it becomes the
  # subject of the merge commit on main, which the changelog and the version bump both
  # read. Nothing validated it until this job existed, so a badly-typed title could put
  # a non-conventional commit on main with no gate anywhere in the pipeline.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the PR diff for the src/ guard
          persist-credentials: false

      # The title keeps the commit rules, including the release-type-needs-src guard,
      # judged against everything the pull request changes.
      - name: Lint the PR title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title.txt"
          if ! MESSAGE_FILE="$RUNNER_TEMP/pr-title.txt" \
               CHANGED_PATHS="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")" \
               bash scripts/git/check-commit-message.sh; then
            echo "::error::PR title is not a valid conventional commit. It becomes the merge commit subject on main."
            exit 1
          fi

      - name: Report required status context
        if: ${{ always() }}
        uses: $/.github/actions/report-status-context
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          job-status: ${{ job.status }}
          status-context: Commit Message Lint / pr-title
          target-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # The commits and the title belong to a pull request, and a merge group has
  # neither: both were linted on the pull request before it could join the queue.
  # The queue still waits for every required context on the merge group's commit,
  # so this job reports the two pull-request contexts there. release-policy runs
  # in full on the merge group.
  merge-group:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Report the commitlint context
        if: ${{ always() }}
        uses: $/.github/actions/report-status-context
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          job-status: ${{ job.status }}
          status-context: Commit Message Lint / commitlint
          target-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Report the pr-title context
        if: ${{ always() }}
        uses: $/.github/actions/report-status-context
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          job-status: ${{ job.status }}
          status-context: Commit Message Lint / pr-title
          target-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
