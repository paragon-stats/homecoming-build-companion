---

name: Release
on:
  push:
    branches:
      - main
  # A deliberate cut when a push did not release, for instance after a seed tag
  # was placed by hand. The bump is still computed from the commits; there is
  # no input that names a version.
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Cut a release from the merged commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The tag push and the GitHub Release need write access on this job only.
      contents: write
    # The release action's own outputs: released is "true" only when this run cut a new tag.
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      # The one checkout in this repository that keeps its credentials: the
      # release action pushes the signed tag over git with them. Every other
      # workflow checks out with persist-credentials: false.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # semantic-release needs the full tag history

      # Tag-only python-semantic-release, the org's release tool and the GitHub
      # form of the GitLab ci-templates release component: main is PR-only with
      # required signatures, so no bot commit ever lands. Merging a feat:, fix:,
      # perf:, security: or revert: commit cuts one release; other types cut
      # nothing. The bump policy lives in pyproject.toml [tool.semantic_release];
      # the action fails closed when it is missing, when the clone is shallow, or
      # when no vX.Y.Z tag exists.
      - name: Release
        id: release
        uses: paragon-stats/github-actions/release@8e164c6001e7a28bf2b06e6c528f97cda9af37cb  # v2.2.1
        with:
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          vcs-release: 'true'

      - name: Report
        shell: bash
        env:
          RELEASED: ${{ steps.release.outputs.released }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [ "$RELEASED" = "true" ]; then
            echo "released $TAG"
          else
            echo "no release-triggering commit since $TAG; nothing cut"
          fi

  # The SBOM of the packages coh-engine ships, attached to the release this run cut. A run that cut nothing skips the
  # job, which leaves the run green. Windows, as in the build job, so the SBOM comes from the same locked restore.
  sbom:
    name: Attach the SBOM to the release
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      # gh release upload adds an asset to the release.
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - name: Attach the SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          $version = $env:TAG -replace '^v', ''
          dotnet tool run dotnet-CycloneDX src/CohEngine.Cli/CohEngine.Cli.csproj --output-format Json --output $env:RUNNER_TEMP --filename coh-engine.cdx.json --set-name coh-engine --set-version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $shipped = @((Get-Content (Join-Path $env:RUNNER_TEMP 'coh-engine.cdx.json') -Raw | ConvertFrom-Json).components | Where-Object scope -eq 'required')
          if (-not ($shipped | Where-Object name -eq 'ModelContextProtocol')) { Write-Error "The SBOM lists $($shipped.Count) shipped packages and not ModelContextProtocol."; exit 1 }
          gh release upload $env:TAG (Join-Path $env:RUNNER_TEMP 'coh-engine.cdx.json') --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
