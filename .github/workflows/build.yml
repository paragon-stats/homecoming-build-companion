name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # required check: a cancelled run must still report

jobs:
  build:
    # Windows only: Homecoming does not run natively on Linux. The matrix shape is
    # kept for the one entry on purpose - collapsing it would rename the required
    # check from "build (windows-latest)" to "build", and a required context that
    # never reports under its old name freezes every PR.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0  # MinVer derives the version from git history + tags
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet tool restore
      - name: Check console output encoding
        run: dotnet run scripts/dev/check-encoding.cs
      - name: Check banned words
        env:
          COH_BANNED_NAMES: ${{ secrets.COH_BANNED_NAMES }}
        run: dotnet run scripts/dev/check-banned-words.cs
      # Whitespace, line endings, final newline, JSON and TOML syntax, markdownlint and the 15 MB limit on the files the change
      # touches. git writes the NUL-separated list straight to a file, deletions left out, so a diff of thousands of paths
      # cannot overflow the command line and no shell re-encodes a path.
      - name: Check the changed text files
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          $list = Join-Path $env:RUNNER_TEMP 'changed-files.txt'
          git diff --name-only -z --diff-filter=d "--output=$list" "$env:BASE_SHA...$env:HEAD_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run scripts/dev/check-text-files.cs -- --files-from $list
      - name: Check coverage exclusions
        run: dotnet run scripts/dev/check-coverage-exclusions.cs
      # The rule must still fail where it should and pass where it should: expected exit codes in order.
      - name: Check the coverage-exclusion rule itself
        run: |
          $cases = @(
            @{ Expect = 1; Args = @('--seed', 'tests/fixtures/coverage-exclusion-seed.txt') },
            @{ Expect = 0; Args = @('--seed', 'tests/fixtures/coverage-exclusion-ignored.txt') },
            @{ Expect = 0; Args = @('--seed', 'tests/fixtures/coverage-exclusion-context.txt', '--as', 'src/Sample/SampleJsonContext.cs') },
            @{ Expect = 1; Args = @('--seed', 'tests/fixtures/coverage-exclusion-seed.txt', '--as', 'src/Sample/SampleJsonContext.cs') }
          )
          $failed = $false
          foreach ($case in $cases) {
            dotnet run scripts/dev/check-coverage-exclusions.cs -- @($case.Args)
            if ($LASTEXITCODE -ne $case.Expect) {
              Write-Error "check-coverage-exclusions $($case.Args -join ' '): exit $LASTEXITCODE, expected $($case.Expect)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          exit 0
      # The CI scripts run outside the solution, so their tests are built in: --selftest.
      - name: Self-test the CI scripts
        run: |
          foreach ($script in 'scripts/ci/filter-sarif.cs', 'scripts/ci/sonar-gate.cs', 'scripts/ci/check-release-policy.cs', 'tools/pr-summary.cs') {
            dotnet run $script -- --selftest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: dotnet format --verify-no-changes --severity error --no-restore
      - run: dotnet build --no-restore
      # Visual Studio XML coverage: dotnet-coverage supports the Microsoft.Testing.Platform
      # runner; coverlet.collector / OpenCover do not.
      - name: Test with coverage
        run: dotnet tool run dotnet-coverage collect "dotnet test --no-build" -f xml -o coverage.xml
      # Source-generator output (*.g.cs under obj/, such as the [GeneratedRegex] code) is not
      # hand-written, so it is left out of the report by path.
      - name: Coverage report
        run: >
          dotnet tool run reportgenerator -reports:coverage.xml
          -targetdir:coveragereport
          -reporttypes:"MarkdownSummaryGithub;JsonSummary"
          -assemblyfilters:"-*.Tests.dll"
          -filefilters:"-*.g.cs"
      # No `if: always()`: coverage measured over a failed test run is partial,
      # and publishing it invites chasing a number that reflects the failure
      # rather than the code.
      - name: Publish coverage summary
        run: if (Test-Path coveragereport/SummaryGithub.md) { Get-Content coveragereport/SummaryGithub.md >> $env:GITHUB_STEP_SUMMARY }
      - name: Coverage gate
        env:
          MIN_COVERAGE: '100'  # every human-written line
        run: |
          $s = (Get-Content coveragereport/Summary.json -Raw | ConvertFrom-Json).summary
          if ($null -eq $s.linecoverage -or $s.coverablelines -eq 0) {
            Write-Host '::notice::No production code to cover yet - coverage gate passes (bootstrap).'
            exit 0
          }
          $cov = [double]$s.linecoverage
          $min = [double]$env:MIN_COVERAGE
          Write-Host "Line coverage: $cov% (gate: >= $min%)"
          if ($cov -lt $min) {
            Write-Error "Coverage $cov% is below the $min% gate."
            exit 1
          }
      # The SBOM each release carries (release.yml), generated here so its command is proven on every pull request
      # and not first at release time. Packages the CLI ships are scope "required"; analyzers and build tools "excluded".
      - name: Generate the SBOM
        run: |
          $version = '0.0.0'
          dotnet tool run dotnet-CycloneDX src/CohEngine.Cli/CohEngine.Cli.csproj --output-format Json --output $env:RUNNER_TEMP --filename coh-engine.cdx.json --set-name coh-engine --set-version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $shipped = @((Get-Content (Join-Path $env:RUNNER_TEMP 'coh-engine.cdx.json') -Raw | ConvertFrom-Json).components | Where-Object scope -eq 'required')
          if (-not ($shipped | Where-Object name -eq 'ModelContextProtocol')) { Write-Error "The SBOM lists $($shipped.Count) shipped packages and not ModelContextProtocol."; exit 1 }
          Write-Host "The SBOM lists $($shipped.Count) shipped packages."

  # The only check that exercises what users download: every test above runs
  # in-process, so Native AOT trimming failures are invisible to them. Gated
  # behind `build` because an artifact from a tree that does not build or whose
  # tests fail cannot be reliably judged. win-x64 only, the single published RID.
  binary:
    name: binary
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0  # MinVer stamps the version --version prints
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          global-json-file: global.json
      # A restore with -r keeps only that runtime and no longer matches the lock file's runtimes, which locked mode
      # refuses (NU1004); the plain restore checks the lock file, and the publish reuses its result.
      - run: dotnet restore src/CohEngine.Cli
      - run: dotnet publish src/CohEngine.Cli -c Release -r win-x64 --no-restore
      - name: Run the published binary
        run: |
          $exe = 'src/CohEngine.Cli/bin/Release/net10.0/win-x64/publish/CohEngine.Cli.exe'
          $version = & $exe --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^coh-engine \d') { throw "--version failed: exit $LASTEXITCODE, output '$version'" }
          Write-Host $version
          $usage = & $exe --help
          if ($LASTEXITCODE -ne 0 -or $usage -notmatch '^usage: coh-engine') { throw "--help failed: exit $LASTEXITCODE, output '$usage'" }
          Write-Host $usage
