---
# CalVer tagging workflow - DISABLED, pending replacement by semver (#58).
#
# Creates a CalVer tag and GitHub Release. Version format: YYYY.0M.MICRO.
#
# The automatic trigger is removed deliberately. The repository moved to semver:
# tags v0.1.0 through v0.8.0 were backfilled onto main, reconstructing one bump per
# merged pull request. This workflow computes its version with scripts.devops.calver,
# whose CALVER_TAG_RE only matches `vYYYY.MM.N`, so it cannot see those semver tags at
# all - `--dry-run` currently returns 2026.08.0. Left on `push: main` it would cut
# v2026.08.0 on the next merge, on top of the semver series, and publish a Release for
# it.
#
# Kept rather than deleted so the tagging and release-notes steps remain available as a
# reference while #58 replaces the version computation. workflow_dispatch means it only
# ever runs if someone deliberately starts it.
#
# Do not restore the push trigger. Delete this file as part of #58.

name: CalVer Tag

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  calver-tag:
    name: Compute version and tag
    if: >
      !contains(github.event.head_commit.message, 'chore(release):') &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'

      - name: Compute next version
        id: calver
        run: |
          version=$(.venv/bin/python -m scripts.devops.calver --dry-run)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check
        run: |
          if git tag -l "${{ steps.calver.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create annotated tag via helper
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .venv/bin/python -m scripts.github.create_tag \
            --repo "${{ github.repository }}" \
            --tag "${{ steps.calver.outputs.tag }}" \
            --sha "${{ github.sha }}" \
            --message "Release ${{ steps.calver.outputs.tag }}"

      - name: Generate release notes
        id: changelog
        if: steps.check.outputs.exists == 'false'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ steps.calver.outputs.tag }} --unreleased --strip header
        env:
          OUTPUT: release-notes.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.calver.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.calver.outputs.tag }}" \
            --notes-file release-notes.md
...
